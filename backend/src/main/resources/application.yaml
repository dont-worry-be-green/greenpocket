spring:
  application:
    name: greenpocket-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

clova:
  ocr:
    invoke-url: ${CLOVA_OCR_INVOKE_URL:}
    secret: ${CLOVA_OCR_SECRET:}
    management-template-id: ${CLOVA_OCR_MANAGEMENT_TEMPLATE_ID:${CLOVA_OCR_TEMPLATE_ID:}}
    electricity-template-id: ${CLOVA_OCR_ELECTRICITY_TEMPLATE_ID:}
    water-template-id: ${CLOVA_OCR_WATER_TEMPLATE_ID:}
    gas-template-id: ${CLOVA_OCR_GAS_TEMPLATE_ID:}

greenpocket:
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:1800}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
    demo-enabled: ${DEMO_AUTH_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
